[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-telegram-bridge"
version = "0.1.0"
description = "Lightweight bridge connecting a headless Antigravity agent with Telegram."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["python-telegram-bot>=22,<23"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Communications :: Chat",
]

[project.scripts]
agy-telegram-bridge = "agy_telegram_bridge.bot:main"
agy-telegram-notify = "agy_telegram_bridge.notify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agy_telegram_bridge = ["prompts/*.md"]
